# This file generates the GitHub Actions matrix.
#
# Reference: https://zmk.dev/docs/user-setup#add-a-keyboard
#
# `studio-rpc-usb-uart` adds the USB CDC-ACM endpoint that ZMK Studio talks to.
# `CONFIG_ZMK_STUDIO=y` lives in the shield's
# `boards/shields/alleindrach/alleindrach.conf`, so local builds pick it up too.
#
# NOTE: only ONE `snippet:` is allowed per entry (ZMK's build action passes a
# single `-S`), which is why USB logging can never be enabled by adding the
# upstream `zmk-usb-logging` snippet here: `studio-rpc-usb-uart` already takes
# that slot. Logging is off anyway; should you want it back, uncomment
# `CONFIG_ZMK_USB_LOGGING=y` in `config/alleindrach.conf` *and* the inline
# CDC-ACM console block at the bottom of
# `boards/shields/alleindrach/boards/nice_nano_v2.overlay`.
#
# This repo also carries `zephyr/module.yml` at its root, so the upstream CI
# workflow detects it and passes `-DZMK_EXTRA_MODULES=$GITHUB_WORKSPACE` for us.
---
include:
  - board: nice_nano_v2
    shield: alleindrach
    snippet: studio-rpc-usb-uart
  - board: nice_nano_v2
    shield: settings_reset
