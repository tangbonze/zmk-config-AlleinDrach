# This file generates the GitHub Actions matrix.
#
# Reference: https://zmk.dev/docs/user-setup#add-a-keyboard
#
# `studio-rpc-usb-uart` adds the USB CDC-ACM endpoint that ZMK Studio talks to.
# `CONFIG_ZMK_STUDIO=y` lives in the shield's
# `boards/shields/alleindrach/alleindrach.conf`, so local builds pick it up too.
#
# NOTE: only ONE `snippet:` is allowed per entry (ZMK's build action passes a
# single `-S`), which is why the USB logging console is declared inline in
# `boards/shields/alleindrach/boards/nice_nano_v2.overlay` instead of by adding
# the upstream `zmk-usb-logging` snippet here.
---
include:
  - board: nice_nano_v2
    shield: alleindrach
    snippet: studio-rpc-usb-uart
  - board: nice_nano_v2
    shield: settings_reset
