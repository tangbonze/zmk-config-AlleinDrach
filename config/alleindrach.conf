#
# Corne Settings
#

# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y

# Put configuration options here

#
# Logging
#

# USB CDC-ACM logging is OFF.
#
# `ZMK_USB_LOGGING` selects `USB_UART_CONSOLE` (see ZMK's app/Kconfig), which
# requires a live `chosen { zephyr,console = <cdc-acm-uart>; }`. Stock ZMK's
# nice_nano board declares no `zephyr,console` at all, and this shield hands
# `uart0` to the PS/2 trackpoint driver (config/include/mouse_tp.dtsi), so the
# only supported console source is upstream's `zmk-usb-logging` snippet -- but
# ZMK's build action accepts just ONE `snippet:` per build entry, and that slot
# is taken by `studio-rpc-usb-uart` (ZMK Studio).
#
# Keeping logging off means the keyboard exposes a single USB CDC-ACM port
# (the ZMK Studio RPC one), so there is nothing to pick wrong in DYA/ZMK Studio.
#
# To bring USB logging back (a second serial port, handy when debugging the
# trackpoint), do BOTH of:
#   1. uncomment `CONFIG_ZMK_USB_LOGGING=y` below, and
#   2. uncomment the "Console / logging transport" block at the end of
#      boards/shields/alleindrach/boards/nice_nano_v2.overlay (and
#      nice_nano.overlay), which declares the CDC-ACM console node.
# CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_PS2_LOG_LEVEL_DBG=n
CONFIG_UART_LOG_LEVEL_DBG=n
CONFIG_LOG_MODE_IMMEDIATE=n

# This setting is important to get the full log
# one where the initial parts are cut out
#
# NOTE (studio migration): dead while USB logging is off. The symbol depends on
# `ZMK_USB_LOGGING`, so assigning it anyway makes Kconfig warn
# "LOG_PROCESS_THREAD_STARTUP_DELAY_MS ... was assigned the value '3000' but got
# the value ''". Uncomment together with `CONFIG_ZMK_USB_LOGGING=y` above.
# CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000


