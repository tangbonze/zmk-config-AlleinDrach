# Manifest for the GitHub Actions build and for `west init -l config`.
#
#   west init -l config          # dependencies land next to this file's parent
#   west update --narrow
#
# For a self-contained local checkout that keeps Zephyr/ZMK under
# `./dependencies`, use `west-standalone.yml` instead (see the Makefile).
manifest:
  self:
    path: config
    import: west-dependency.yml
