# SPDX-License-Identifier: MIT
#
# Manifest for a self-contained local checkout: every dependency is checked out
# under `./dependencies` instead of polluting the repository root.
#
#   west init -l config --mf west-standalone.yml
#   west update --narrow
#
# `make init` does both for you.
manifest:
  self:
    path: config
    import:
      file: west-dependency.yml
      path-prefix: dependencies
